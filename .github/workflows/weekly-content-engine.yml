name: Weekly Content Engine (Auto-generate 10 prompts)

on:
  schedule:
    # 毎週月曜日 午前0:00 (UTC) = 日本時間 月曜 午前9:00 (JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    name: Generate 10 Prompts & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prompt generation script
        run: node scripts/auto-generate-prompts.mjs

      - name: Sync Prompts to Notion Database
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          node scripts/sync-to-notion.mjs || echo "⚠️ Notion同期でエラーが発生しましたが、デプロイ処理を続行します。"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/prompts/
          if git diff --staged --quiet; then
            echo "No new prompts to commit."
          else
            git commit -m "chore(content): auto-generate weekly 10 prompts"
            git push origin main
          fi

      - name: Run Weekly SEO & Conversion Report
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: "https://prompt-hub-lab.github.io/prompt-hub/"
        run: |
          node scripts/weekly-seo-report.mjs
